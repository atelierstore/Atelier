[package]
name = "atelier-idevice-bridge"
version = "0.1.0"
edition = "2024"
publish = false
description = "Atelier's on-phone pairing host, built on idevice (MIT)"

[lib]
crate-type = ["rlib"]

[dependencies]
# Fetched by fetch-idevice.sh. This crate only exists to build and test
# src/pairing.rs on its own; the app gets it compiled into idevice-ffi instead
# (build-rust.sh), so it may only use crates idevice-ffi also depends on.
idevice = { path = "vendor/idevice/idevice", default-features = false, features = ["remote_pairing", "rustcrypto"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
plist = "1.7"

[dev-dependencies]
# The test "phone": pair-setup as idevice models it, from the phone's side,
# with the crypto crates idevice itself uses for remote pairing.
idevice-srp = "0.6"
rand = "0.9"
base64 = "0.22"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
