<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Search Atelier</title>
<meta name="description" content="Opens Atelier, which searches the apps in all your sources.">
<!-- Each search link is its own address, and none belongs in search
     results, even once the rest of the site does. -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#3A5A47">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/site.css">
<script type="module" src="/search.js"></script>
</head>
<body class="install-page">
<main class="install-main">
  <div class="install-icons">
    <img class="install-icon" src="/img/icon.png" alt="" width="84" height="84">
  </div>

  <!-- search.js fills this in from the page's address. -->
  <div id="link-page" hidden>
    <h1>Search Atelier</h1>
    <p class="install-meta" data-meta></p>
    <p class="install-what">Atelier searches the apps in all your sources.</p>
    <a class="btn btn-primary" id="link-open" href="/">Open in Atelier</a>
    <p class="install-note" data-on="ios">If Safari asks to open Atelier, tap Open.</p>
    <p class="install-note" data-on="other" hidden>Open this link on the iPhone or iPad that has Atelier.</p>
    <nav class="install-more" aria-label="More">
      <a class="text-link" href="/#install">Don't have Atelier? Get it</a>
    </nav>
  </div>

  <div id="link-problem" hidden>
    <h1>Atelier can't open this link</h1>
    <p class="install-what" data-reason></p>
    <nav class="install-more" aria-label="More">
      <a class="text-link" href="/">Go to Atelier's website</a>
    </nav>
  </div>

  <noscript>
    <h1>Search Atelier</h1>
    <p class="install-what">This page needs JavaScript to open Atelier.</p>
  </noscript>
</main>
</body>
</html>
