# Atelier's website: the files in public/, served by a Cloudflare Worker
# (Workers static assets), whose code (src/) reads the app an install link
# installs and the source a source or app link names, and keeps the signed
# Atelier the certificate page uploads for iOS to install, and keeps the
# site's counts for the Stats page. See README.md.
name = "atelier-website"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
# Each version gets its own URL as well.
preview_urls = true

# Requests for these files don't run src/index.js; it gets the others, and
# passes what isn't its own to ASSETS. The home page runs it first, to list
# AltStore PAL first for visitors where Apple allows it (src/region.js).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/"]

# No logs, as for the manifest Worker.
[observability]
enabled = false

# The Durable Object that keeps the signed Atelier the certificate page
# uploads, until iOS has downloaded it (src/ota.js). The Worker reaches it
# through ctx.exports, so it needs no binding, and Cloudflare makes it on
# deploy, in Previews too. It keeps the IPA in SQLite, the only storage
# Durable Objects have on the Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignedApp"]

# The Durable Object that keeps the IPAs GitHub Actions builds for 7 days
# (src/builds.js), the same way.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["BuildApp"]

# The Durable Object that keeps the site's counts of what people view and
# tap, a day's totals at a time, for the Stats page (src/stats.js).
[[migrations]]
tag = "v3"
new_sqlite_classes = ["SiteStats"]

# The Stats page's key is the STATS_KEY secret, which isn't kept here:
# `npx wrangler secret put STATS_KEY`, or the Worker's Settings › Variables
# and Secrets (README.md, Stats). Without it, /stats/data answers 503.

[vars]
# Whose builds /builds keeps: only this repo's build workflow can send them,
# with the token GitHub Actions gives it. Its ID too, which a repo made later
# under the same name wouldn't have.
BUILDS_REPOSITORY = "atelierstore/Atelier"
BUILDS_REPOSITORY_ID = "1453990179"

# Each build's record, with all its addresses, which only Cloudflare API
# tokens for the account can read (src/builds.js). Without an ID, the first
# deploy makes the namespace, named after the Worker, and later deploys keep
# it (Wrangler 4.45 or later). Its ID is in the dashboard: Storage & databases
# › Workers KV.
[[kv_namespaces]]
binding = "BUILDS"

# Pull requests' builds run `npx wrangler preview`, which needs this block
# (it can be empty) and makes a Preview of the site named after the branch.
# A Preview doesn't take observability from above, so it's turned off here too.
[previews]

[previews.observability]
enabled = false
